name: Sync and Deploy All Branches

on:
  push:
    branches:
      - '**'

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Sync branch to destination GitHub repository
      - name: Push Branch with Auto-Retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 300

          command: |
            DEST_OWNER="php24backup"
            DEST_REPO="games"

            BRANCH_NAME="${GITHUB_REF#refs/heads/}"

            REMOTE_URL="https://x-access-token:${{ secrets.DESTINATION_GITHUB_TOKEN }}@github.com/${DEST_OWNER}/${DEST_REPO}.git"

            git remote remove destination 2>/dev/null || true
            git remote add destination "$REMOTE_URL"

            git push destination "HEAD:refs/heads/${BRANCH_NAME}" --force

